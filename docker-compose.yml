version: '3.8'

services:
  search_service:
    build: .
    container_name: search_service
    networks:
      - test_network
    ports:
      - "8008:8008"
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding_server:8000
      - OPENSEARCH_URL=https://opensearch:9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=our_password
    depends_on:
      - opensearch
      - embedding_server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8008/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  test_network:
    external: true

# Note: OpenSearch and embedding_server should be running separately
# This compose file only defines the search service itself
# To use with external services, ensure they are on test_network
